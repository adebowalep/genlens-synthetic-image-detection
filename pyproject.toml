[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genlens"
version = "0.1.0"
description = "GenLens: explainable and robust synthetic-image detection under generator shift"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "torch>=2.1", "torchvision>=0.16", "timm>=0.9", "captum>=0.7",
  "numpy", "scipy", "scikit-learn", "pandas", "pillow", "opencv-python-headless",
  "matplotlib", "seaborn", "pyyaml", "scikit-image", "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
app = ["streamlit"]
umap = ["umap-learn"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E741", "E702", "E731", "E402"]
